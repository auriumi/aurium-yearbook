name: Review checks

on:
  pull_request:
  push:
    branches: ['codex/review-integration-sep30-ui']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Review client and Masterlist failure checks
        run: node --test scripts/check-review-clients.cjs
      - run: node scripts/check-information-workspace.cjs
      - name: Reproduce stale development route types
        run: node scripts/seed-stale-dev-types.mjs
      - name: Build with stale development artifacts present
        run: npm run build
      - name: Verify production type-checking scope
        run: node scripts/check-production-types.mjs
